spring:
  datasource:
    # demo 环境沿用 p6spy 代理驱动（与 application.yml 的 driver-class-name 配套）
    url: ${DEMO_DB_URL:jdbc:p6spy:postgresql://127.0.0.1:5432/ddd-demo?reWriteBatchedInserts=true}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:demo-data.sql
