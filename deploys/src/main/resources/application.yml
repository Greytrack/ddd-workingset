server:
  port: ${SERVER_PORT:7102}

springdoc:
  packages-to-scan: bootstrap.web,alm.requirement.adapters,sk.workingset.adapters,sk.tracker.adapters
  paths-to-match: /api/**
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs
    version: openapi_3_0
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    disable-swagger-default-url: true
    tags-sorter: alpha
    operations-sorter: method

knife4j:
  enable: ${API_DOCS_ENABLED:true}

workingset:
  cow:
    order-gap-wait: ${COW_ORDER_GAP_WAIT:1s}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  level:
    # p6spy（代理驱动）通过 Slf4J 输出控制台实时 SQL；设为 OFF 可静默
    p6spy: ${P6SPY_LOG_LEVEL:INFO}

spring:
  application:
    name: ddd-workingset
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # p6spy 代理驱动：driver-class-name 固定为 P6SpyDriver，url 需带 jdbc:p6spy: 前缀，
    # 真实 PostgreSQL 驱动由 p6spy 转交；SQL 输出到控制台（见 spy.properties、logging.level.p6spy）。
    url: ${DB_URL:jdbc:p6spy:postgresql://127.0.0.1:5432/ddd-test?reWriteBatchedInserts=true}
    username: postgres
    password: 123QWEASD
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HikariPool-air-dev
      auto-commit: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:63179}
      database: ${REDIS_DATABASE:5}
      password: ${REDIS_PASSWORD:}
      client-type: lettuce
      timeout: 5s
      lettuce:
        pool:
          min-idle: 2
          max-idle: 8
          max-active: 8
          max-wait: -1ms
  modulith:
    republish-outstanding-events-on-restart: true
    events:
      jdbc:
        schema-initialization:
          enabled: ${MODULITH_SCHEMA_INITIALIZATION:true}
  profiles:
    # Maven 构建时替换；dev 使用本文件，local/demo 叠加对应环境文件。
    # 运行时仍可通过 SPRING_PROFILES_ACTIVE 或 --spring.profiles.active 覆盖。
    active: '@profiles.active@'
  servlet:
    multipart:
      # 单文件最大大小
      max-file-size: 100MB
      # 整次请求最大大小
      max-request-size: 100MB
