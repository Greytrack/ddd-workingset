# p6spy 运行配置：开发／联调时在控制台打印实时 SQL。
# 生效条件：spring.datasource.driver-class-name=com.p6spy.engine.spy.P6SpyDriver，
# 且 spring.datasource.url 带 jdbc:p6spy: 前缀；日志级别见 logging.level.p6spy。
# 需要加载的 p6spy 模块：代理驱动 + SQL 日志
modulelist=com.p6spy.engine.spy.P6SpyFactory,com.p6spy.engine.logging.P6LogFactory
# 输出到 SLF4J（logger 名 p6spy），由应用控制台日志格式渲染，不额外落盘
appender=com.p6spy.engine.spy.appender.Slf4JLogger
# 单行输出：时间 | 耗时 | 类别 | 连接号 | 已填充参数的 SQL
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=%(currentTime) | %(executionTime) ms | %(category) | conn=%(connectionId) | %(sqlSingleLine)
dateformat=HH:mm:ss.SSS
# 只保留有业务价值的 SQL 与批处理记录，屏蔽结果集、提交等噪音
excludecategories=info,debug,result,resultset,commit
