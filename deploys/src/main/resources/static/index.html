<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Working Set Explorer</title>
<link rel="stylesheet" href="/app.css?v=3">
<link rel="stylesheet" href="/merge.css?v=3">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div>
      <h1>Working Set Explorer</h1>
      <p>工作集管理</p>
    </div>
  </div>
  <details id="worksetPicker" class="workset-picker">
    <summary><span class="picker-label">工作集</span><strong id="activeWorkset">选择工作集</strong><span class="picker-chevron" aria-hidden="true"></span></summary>
    <div class="picker-menu">
      <div class="panel-head"><h2>切换工作集</h2><span id="worksetCount" class="muted"></span></div>
      <div id="worksetTree" class="tree"></div>
    </div>
  </details>
  <div class="actions">
    <span id="status" class="status" role="status">准备就绪</span>
    <button id="createWorksetBtn" type="button" class="btn primary">＋ 创建工作集</button>
    <button id="taskCenterBtn" type="button" class="btn">任务中心 <span id="taskBadge" class="badge task-badge">0</span></button>
    <button id="refresh" type="button" class="btn">刷新</button>
  </div>
</header>

<nav class="pane-nav" aria-label="工作区">
  <button type="button" data-pane="spaces" aria-controls="spacesPanel" aria-pressed="true">产品空间</button>
  <button type="button" data-pane="trackers" aria-controls="trackersPanel" aria-pressed="false">跟踪分类</button>
  <button type="button" data-pane="items" aria-controls="itemsPanel" aria-pressed="false">Item</button>
</nav>

<main class="layout" data-active-pane="spaces">
  <aside id="spacesPanel" class="panel">
    <div class="panel-head"><h2>产品空间</h2><span id="spaceCount" class="muted"></span></div>
    <div id="spaceList" class="space-list"></div>
  </aside>

  <section id="trackersPanel" class="panel">
    <div class="panel-head">
      <h2>跟踪分类</h2>
      <div class="panel-actions">
        <span id="trackerCount" class="muted"></span>
        <button id="createTrackerBtn" type="button" class="btn small primary hidden" aria-label="新建跟踪分类">＋ 新建</button>
      </div>
    </div>
    <div id="selectedSpace" class="selected-workset hidden"></div>
    <div id="trackerList" class="tree"></div>
  </section>

  <section id="itemsPanel" class="panel">
    <div class="panel-head"><h2>Item</h2><span id="itemCount" class="muted"></span></div>
    <div id="selectedTracker" class="selected-tracker"><div class="empty">请选择跟踪分类</div></div>
    <div id="itemToolbar" class="item-toolbar hidden">
      <input id="itemFilter" type="search" aria-label="筛选 Item" placeholder="按名称或 ID 筛选">
    </div>
    <div id="itemArea" class="item-area" aria-busy="false"><div class="empty">选择跟踪分类后查看 Item</div></div>
    <div id="itemDetail" class="item-detail hidden" aria-label="Item 详情" role="region"></div>
  </section>
</main>

<div id="modalOverlay" class="modal-overlay hidden">
  <section id="modalPanel" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div id="modalContent"></div>
  </section>
</div>

<div id="mergeOverlay" class="modal-overlay hidden">
  <section class="modal wide" role="dialog" aria-modal="true" aria-labelledby="mergeTitle">
    <div id="mergeContent"></div>
  </section>
</div>

<script src="/js/core.js?v=3" defer></script>
<script src="/js/worksets.js?v=5" defer></script>
<script src="/js/features.js?v=5" defer></script>
<script src="/js/merge.js?v=6" defer></script>
</body>
</html>
