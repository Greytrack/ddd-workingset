# Legacy fixture helpers use the same decimal strings as the REST boundary.
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/ddd-bigint-test?stringtype=unspecified}
# 测试直连 PostgreSQL：不走 application.yml 的 p6spy 代理驱动，避免测试期 SQL 日志噪声
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.schema-locations=classpath:schema.sql,classpath:tracker-fixtures.sql,classpath:common-test-cleanup.sql
