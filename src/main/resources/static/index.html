<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Working Set Explorer</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/merge.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">WS</div>
    <div>
      <h1>Working Set Explorer</h1>
      <p>工作集 · 产品空间 · Tracker · Item</p>
    </div>
  </div>
  <div class="actions">
    <span id="status" class="status">准备就绪</span>
    <button id="mergeBtn" type="button" class="btn">比较 / 合并</button>
    <button id="createWorksetBtn" type="button" class="btn primary">＋ 创建工作集</button>
    <button id="taskCenterBtn" type="button" class="btn">任务中心 <span id="taskBadge" class="badge task-badge">0</span></button>
    <button id="refresh" type="button" class="btn">刷新</button>
  </div>
</header>

<main class="layout">
  <aside class="panel">
    <div class="panel-head"><h2>工作集</h2><span id="worksetCount" class="muted"></span></div>
    <div id="worksetTree" class="tree"></div>
  </aside>

  <section class="panel">
    <div class="panel-head"><h2>产品空间</h2><span id="spaceCount" class="muted"></span></div>
    <div id="selectedWorkset" class="selected-workset"><div class="empty">从左侧选择工作集</div></div>
    <div id="spaceList" class="space-list"></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Item</h2><span id="itemCount" class="muted"></span></div>
    <div id="selectedTracker" class="selected-tracker"><div class="empty">从中间选择一个 Tracker</div></div>
    <div id="itemArea" class="item-area"><div class="empty">选择 Tracker 后显示 Item 列表</div></div>
  </section>
</main>

<div id="modalOverlay" class="modal-overlay hidden">
  <section id="modalPanel" class="modal" role="dialog" aria-modal="true">
    <div id="modalContent"></div>
  </section>
</div>

<div id="mergeOverlay" class="modal-overlay hidden">
  <section class="modal wide" role="dialog" aria-modal="true">
    <div id="mergeContent"></div>
  </section>
</div>

<script src="/js/core.js" defer></script>
<script src="/js/worksets.js" defer></script>
<script src="/js/features.js" defer></script>
<script src="/js/merge.js" defer></script>
</body>
</html>
